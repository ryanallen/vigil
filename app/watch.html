<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigil</title>
<meta name="description" content="A night watch through Kirra's cameras. The drill breaks through, the survey party stops answering, and one robot is left to send below.">
<meta name="theme-color" content="#0b0d0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23202626%27/%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%274%27 fill=%27%23e9e8e2%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="watch.css">
</head>
<body>
<main class="home" id="home">
  <canvas class="home-canvas" aria-hidden="true"></canvas>
  <div class="home-in">
    <p class="home-clock">03:12 · Home, Earth</p>
    <h1>Vigil</h1>
    <p class="home-line">Everyone else is asleep. Kirra's survey is still running.</p>
    <h2>Choose a place to watch</h2>
    <ul class="places" id="places"></ul>
  </div>
</main>

<div class="watch" id="watch" hidden>
  <canvas class="cam-canvas" aria-hidden="true"></canvas>
  <img class="cam-fallback" alt="" hidden>
  <canvas class="atmos" aria-hidden="true"></canvas>
  <div class="hud">
    <p class="cam-label"></p>
    <p class="clock">03:12</p>
    <p class="lag"></p>
    <p class="hint"></p>
    <p class="next" aria-live="polite"></p>
    <ol class="wire" aria-live="polite"></ol>
    <div class="panel"></div>
    <nav class="cams" aria-label="Cameras"></nav>
    <button type="button" class="to-wall"></button>
    <figure class="beside" hidden></figure>
  </div>
  <div class="pings"></div>
  <div class="brief" role="dialog" hidden></div>
  <div class="notes" aria-live="polite"></div>
  <div class="ending" role="dialog" aria-live="polite"></div>
</div>

<script type="module">
import { run } from './watch.js';
import { mount } from './depthview.js';
import kirra from './kirra.js';
import tethys from './tethys.js';
import thule from './thule.js';
import helios from './helios.js';
import halcyon from './halcyon.js';
import shackleton from './shackleton.js';
import jezero from './jezero.js';
import atlas from './atlas.js';
import homeWatch from './home.js';

// The wall at Home: each place, where it is, and tonight's line from its story.
const PLACES = [
  ['Kirra Station', '16 Psyche', 'Survey in progress', kirra],
  ['Tethys Farms', 'Pacific', 'one buoy missing', tethys],
  ['Thule Ice', 'Europa', 'intake blocked', thule],
  ['Helios Array', 'near the Sun', 'one sector below its usual output', helios],
  ['Halcyon', '312 aboard', 'camera service', halcyon],
  ['Shackleton Foundry', 'Moon', 'cooling check', shackleton],
  ['Jezero House', 'Mars', 'water check', jezero],
  ['Atlas Works', 'Ceres', 'salt sample', atlas],
  ['Home', 'Earth', 'storm expected', homeWatch],
];
// A place can be watched once its photographs are in; until then it stays on the wall, quiet.
const READY = new Set([homeWatch]);
if (new URLSearchParams(location.search).has('all')) PLACES.forEach(p => READY.add(p[3]));   // for checking stories before their photos are in
if (new URLSearchParams(location.search).has('fast')) PLACES.forEach(p => { p[3].pace = 0.04; }); // for checking a whole night quickly
const home = document.getElementById('home'), watch = document.getElementById('watch');
document.getElementById('places').innerHTML = PLACES.map(([n, p, s, story], i) => { const ok = READY.has(story);
  return `<li${ok ? '' : ' class="quiet"'}><b>${n}</b><span>${p}</span>${s ? `<em>${s}</em>` : ''}${ok ? `<button type="button" data-i="${i}">Watch ${n.split(' ')[0]}</button>` : ''}</li>`; }).join('');
const hv = mount(home.querySelector('.home-canvas'));
if (hv) hv.show(new URL('../media/photo-home-earth-1600.webp', import.meta.url).href, new URL('../media/photo-home-earth-depth.webp', import.meta.url).href);
// One watch runs per page: going back to the wall keeps it waiting where it was; choosing another place starts that one fresh.
const q = new URLSearchParams(location.search);
let playing = null;
const toWall = () => { watch.hidden = true; home.hidden = false; };
function start(i) {
  if (playing === null) { playing = i; home.hidden = true; watch.hidden = false; run(PLACES[i][3], watch, { onWall: toWall }); return; }
  if (playing === i) { home.hidden = true; watch.hidden = false; return; }
  q.set('play', i); location.search = q.toString();
}
document.getElementById('places').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) start(+b.dataset.i); });
if (q.has('play') && READY.has(PLACES[+q.get('play')]?.[3])) start(+q.get('play'));
</script>
</body>
</html>
