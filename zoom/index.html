<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigil</title>
<meta name="theme-color" content="#5b6575">
<style>
  html, body { margin: 0; height: 100%; background: #2e343b; }
  body { overflow: hidden; touch-action: none; }
  figure { position: fixed; margin: 0; overflow: hidden; }
  img, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  figure canvas { opacity: 0; transition: opacity 1.2s ease; }
  figure canvas.on { opacity: 1; }
  #near { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; opacity: 0; pointer-events: none; }
  .words { position: fixed; left: clamp(20px, 6vw, 96px); top: clamp(28px, 9vh, 110px); z-index: 2; color: #eef0f2; text-shadow: 0 1px 14px rgb(20 26 34 / .55); font-family: Georgia, "Iowan Old Style", serif; pointer-events: none; }
  .words p { margin: 0 0 14px; font: 600 12px/1 ui-monospace, Consolas, monospace; letter-spacing: .18em; text-transform: uppercase; opacity: .85; }
  .words h1 { margin: 0; font-weight: 400; font-size: clamp(44px, 7vw, 96px); line-height: 1; letter-spacing: -.01em; }
</style>
</head>
<body>
<div class="words"><p>03:12 · Home, Earth</p><h1>Vigil</h1></div>
<figure>
  <img src="../media/photo-home-earth-2400.webp" width="2400" height="1351" alt="A lone house with one lit window far across dusk moorland." fetchpriority="high">
</figure>
<canvas id="near" aria-hidden="true"></canvas>
<script type="module">
// The live page as it is (the photograph with depth, focus racked to the pointer, the tilt-shift look), and a zoom on top: the wheel,
// a drag or the arrow keys magnify it about the lit window until the photograph runs out of detail, then the 3D view of the house
// takes over through the same look and carries on in along its line of sight to the window. ?z= (0-1) sets the zoom.
import { mount } from './depthview-zoom.js?v=1795666408';
import { mountEngine } from './engine.js?v=1795666408';
const fig = document.querySelector('figure'), img = fig.querySelector('img'), words = document.querySelector('.words'), nearCv = document.getElementById('near');
const P = [0.69, 0.585], HOUSE = P.map(v => (v - 0.5) / 0.9 + 0.5), AT = [0.69, 0.6];
let rect = [0, 0, innerWidth, innerHeight];
function frame() {
  const W = innerWidth, H = innerHeight, w = Math.max(W, H * 16 / 9), h = w * 9 / 16;
  const x = Math.min(0, Math.max(W - w, W * AT[0] - w * HOUSE[0])), y = Math.min(0, Math.max(H - h, H * AT[1] - h * HOUSE[1]));
  Object.assign(fig.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); rect = [x, y, w, h];
}
frame(); addEventListener('resize', frame);
const c = document.createElement('canvas'); c.setAttribute('aria-hidden', 'true'); fig.append(c);
const v = mount(c);
if (!v) { c.remove(); throw 0; }
await v.show('../media/photo-home-earth-2400.webp', '../media/photo-home-earth-depth.webp');
c.classList.add('on');

// The zoom: s runs 0-1. Up to HAND the flat photograph magnifies about the window to ZH times; across the last stretch of that
// the 3D view fades in, drawing the same picture; past it the 3D camera moves in along its line of sight to the window.
const HAND = .4, ZH = 3;
let s = Math.min(1, Math.max(0, +(new URLSearchParams(location.search).get('z') || 0))), goal = s;
const nudge = d => { goal = Math.min(1, Math.max(0, goal + d)); };
addEventListener('wheel', e => { e.preventDefault(); nudge(e.deltaY * .0005); }, { passive: false });
addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'PageDown') nudge(.05); if (e.key === 'ArrowUp' || e.key === 'PageUp') nudge(-.05); });
let dragY = null;
addEventListener('pointerdown', e => { if (e.pointerType === 'touch') dragY = e.clientY; });
addEventListener('pointermove', e => { if (dragY != null) { nudge((dragY - e.clientY) * .002); dragY = e.clientY; } });
addEventListener('pointerup', () => { dragY = null; });

const eng = await mountEngine(nearCv);
const centre = eng ? eng.centre : [0.68, 0.6];
function tick() {
  s += (goal - s) * .08; if (Math.abs(goal - s) < 1e-4) s = goal;
  const z = Math.pow(ZH, Math.min(1, s / HAND)), dolly = Math.max(0, (s - HAND) / (1 - HAND));
  v.zoom(z, centre);
  words.style.opacity = String(Math.max(0, 1 - s / .12));
  const show = eng ? Math.min(1, Math.max(0, (s - (HAND - .06)) / .06)) : 0;
  nearCv.style.opacity = String(show);
  if (show > 0) { const st = v.state(); eng.draw({ z, dolly, fig: rect, fp: st.fp, cam: st.cam, sc: st.sc }); }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
